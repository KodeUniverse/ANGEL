<svg width="680" height="800" viewBox="0 0 680 800" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>angeld system architecture</title>
<desc>Voice and CLI input flow through decode/LLM layers to a permission-enforcing dispatcher, which routes to local or external execution.</desc>
<defs>
<style>
:root {
  --bg:#ffffff; --text:#1a1a1a; --text-sub:#5a5a56; --line:#555550;
  --gray-fill:#f1efe8; --gray-stroke:#888780; --gray-text:#2c2c2a;
  --teal-fill:#e1f5ee; --teal-stroke:#1d9e75; --teal-text:#085041;
  --purple-fill:#eeedfe; --purple-stroke:#7f77dd; --purple-text:#3c3489;
  --coral-fill:#faece7; --coral-stroke:#d85a30; --coral-text:#993c1d;
  --pink-fill:#fbeaf0; --pink-stroke:#d4537e; --pink-text:#993556;
  --container-stroke:#b4b2a9;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#111110; --text:#f0efe9; --text-sub:#b4b2a9; --line:#9c9a92;
    --gray-fill:#2c2c2a; --gray-stroke:#888780; --gray-text:#d3d1c7;
    --teal-fill:#04342c; --teal-stroke:#5dcaa5; --teal-text:#9fe1cb;
    --purple-fill:#26215c; --purple-stroke:#afa9ec; --purple-text:#cecbf6;
    --coral-fill:#4a1b0c; --coral-stroke:#f0997b; --coral-text:#f5c4b3;
    --pink-fill:#4b1528; --pink-stroke:#ed93b1; --pink-text:#f4c0d1;
    --container-stroke:#5f5e5a;
  }
}
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 600; fill: var(--text); }
.ts { font-size: 12px; fill: var(--text-sub); }
.arr { stroke: var(--line); stroke-width: 1.5; fill: none; }
marker path { fill: none; }
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" stroke="var(--line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="800" fill="var(--bg)"/>

<!-- Entry points -->
<rect x="55" y="40" width="170" height="56" rx="8" fill="var(--gray-fill)" stroke="var(--gray-stroke)" stroke-width="0.75"/>
<text class="th" x="140" y="60" text-anchor="middle" fill="var(--gray-text)">angelctl</text>
<text class="ts" x="140" y="82" text-anchor="middle">Identity = OS login user</text>

<rect x="450" y="40" width="180" height="56" rx="8" fill="var(--gray-fill)" stroke="var(--gray-stroke)" stroke-width="0.75"/>
<text class="th" x="540" y="60" text-anchor="middle" fill="var(--gray-text)">Voice prompt</text>
<text class="ts" x="540" y="82" text-anchor="middle">Recorded from mic</text>

<line x1="540" y1="96" x2="540" y2="138" class="arr" marker-end="url(#arrow)"/>

<!-- Voice decode layer container -->
<rect x="220" y="140" width="400" height="150" rx="14" fill="none" stroke="var(--container-stroke)" stroke-width="0.75" stroke-dasharray="4 4"/>
<text class="th" x="236" y="162" fill="var(--text)">Voice decode layer</text>
<text class="ts" x="236" y="178">Runs in parallel</text>

<rect x="240" y="195" width="190" height="56" rx="8" fill="var(--teal-fill)" stroke="var(--teal-stroke)" stroke-width="0.75"/>
<text class="th" x="335" y="215" text-anchor="middle" fill="var(--teal-text)">Speaker verification</text>
<text class="ts" x="335" y="237" text-anchor="middle">Resemblyzer</text>

<rect x="450" y="195" width="150" height="56" rx="8" fill="var(--teal-fill)" stroke="var(--teal-stroke)" stroke-width="0.75"/>
<text class="th" x="525" y="215" text-anchor="middle" fill="var(--teal-text)">Speech to text</text>
<text class="ts" x="525" y="237" text-anchor="middle">whisper-rs</text>

<!-- angelctl bypass line: OS user identity -->
<line x1="140" y1="96" x2="140" y2="500" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="60" y="360">OS user</text>
<text class="ts" x="60" y="374">identity</text>

<!-- Auth output bypasses LLM layer: voice match score -->
<path d="M335 251 L335 305 L160 305 L160 515" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="175" y="330">Voice match</text>
<text class="ts" x="175" y="344">+ score</text>

<!-- STT output goes to LLM layer -->
<path d="M525 251 L525 315 L320 315 L320 378" class="arr" marker-end="url(#arrow)"/>

<!-- LLM layer -->
<rect x="210" y="380" width="220" height="60" rx="8" fill="var(--purple-fill)" stroke="var(--purple-stroke)" stroke-width="0.75"/>
<text class="th" x="320" y="400" text-anchor="middle" fill="var(--purple-text)">LLM layer</text>
<text class="ts" x="320" y="424" text-anchor="middle">Runs via llama-server.cpp</text>

<rect x="450" y="380" width="180" height="60" rx="8" fill="var(--purple-fill)" stroke="var(--purple-stroke)" stroke-width="0.75"/>
<text class="th" x="540" y="400" text-anchor="middle" fill="var(--purple-text)">Tool schemas</text>
<text class="ts" x="540" y="424" text-anchor="middle">OpenAI-style tool list</text>

<line x1="450" y1="410" x2="432" y2="410" class="arr" marker-end="url(#arrow)"/>
<line x1="320" y1="440" x2="320" y2="478" class="arr" marker-end="url(#arrow)"/>

<!-- bypass lines enter dispatcher from the left -->
<path d="M140 500 L230 500" class="arr" marker-end="url(#arrow)"/>
<path d="M160 515 L230 515" class="arr" marker-end="url(#arrow)"/>

<!-- Dispatcher -->
<rect x="230" y="480" width="190" height="60" rx="8" fill="var(--coral-fill)" stroke="var(--coral-stroke)" stroke-width="0.75"/>
<text class="th" x="325" y="500" text-anchor="middle" fill="var(--coral-text)">Toolcall dispatcher</text>
<text class="ts" x="325" y="524" text-anchor="middle">Enforces permission tier</text>

<!-- Dispatcher fans out -->
<path d="M325 540 L325 560 L255 560 L255 598" class="arr" marker-end="url(#arrow)"/>
<path d="M325 540 L325 560 L460 560 L460 598" class="arr" marker-end="url(#arrow)"/>

<rect x="180" y="600" width="150" height="56" rx="8" fill="var(--pink-fill)" stroke="var(--pink-stroke)" stroke-width="0.75"/>
<text class="th" x="255" y="620" text-anchor="middle" fill="var(--pink-text)">AngelAPI</text>
<text class="ts" x="255" y="642" text-anchor="middle">Local syscalls</text>

<rect x="380" y="600" width="160" height="56" rx="8" fill="var(--pink-fill)" stroke="var(--pink-stroke)" stroke-width="0.75"/>
<text class="th" x="460" y="620" text-anchor="middle" fill="var(--pink-text)">Angel MCP client</text>
<text class="ts" x="460" y="642" text-anchor="middle">External tool calls</text>

<line x1="460" y1="656" x2="460" y2="698" class="arr" marker-end="url(#arrow)"/>

<rect x="370" y="700" width="180" height="56" rx="8" fill="var(--pink-fill)" stroke="var(--pink-stroke)" stroke-width="0.75"/>
<text class="th" x="460" y="720" text-anchor="middle" fill="var(--pink-text)">External MCP server</text>
<text class="ts" x="460" y="742" text-anchor="middle">e.g. GitHub, Slack</text>
</svg>
